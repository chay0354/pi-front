<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta httpEquiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta httpEquiv="Pragma" content="no-cache" />
    <meta httpEquiv="Expires" content="0" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <style>
      html, body, #root {
        width: 100%;
        -webkit-overflow-scrolling: touch;
        margin: 0px;
        padding: 0px;
        min-height: 100%;
        direction: rtl;
      }
      #root {
        flex-shrink: 0;
        flex-basis: auto;
        flex-grow: 1;
        display: flex;
        flex: 1;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        height: calc(100% + env(safe-area-inset-top));
      }
      body {
        display: flex;
        overflow-y: auto;
        overscroll-behavior-y: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
      }
      /* Dark scrollbar to match app theme (not white) */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.25) rgba(26,25,38,0.6);
      }
      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      *::-webkit-scrollbar-track {
        background: rgba(26,25,38,0.6);
      }
      *::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.25);
        border-radius: 4px;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.4);
      }
      /* Chat composer: placeholder line-height can diverge from the textarea (WebKit/Blink) */
      #pi-chat-composer-textarea::placeholder {
        line-height: 30px;
      }
      /* Exclusive-offer message textarea: dark, clean scrollbar */
      #pi-chat-offer-message-textarea {
        scrollbar-width: thin;
        scrollbar-color: #0b0c12 #1a1b26;
      }
      #pi-chat-offer-message-textarea::-webkit-scrollbar {
        width: 6px;
      }
      #pi-chat-offer-message-textarea::-webkit-scrollbar-track {
        background: #1a1b26;
        border-radius: 999px;
      }
      #pi-chat-offer-message-textarea::-webkit-scrollbar-thumb {
        background: #0b0c12;
        border-radius: 999px;
      }
      #pi-chat-offer-message-textarea::-webkit-scrollbar-thumb:hover {
        background: #141624;
      }
    </style>
  </head>
  <body>
    <noscript>
      <p>Enable JavaScript to run this app.</p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
